[alembic]
script_location = %(here)s/migrations
# sqlalchemy.url is intentionally empty: env.py always takes the URL from the
# validated Settings (GOLDMASTERS_DATABASE_URL), never from this file.

[loggers]
keys = root

[handlers]
keys = console

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
