[project]
name = "goldmasters-workspace"
version = "0.1.0"
description = "GoldMasters uv workspace root (virtual project; D-42)."
# D-42: pin the interpreter exactly to the machine's 3.14.7 and state the pin
# here rather than relying on uv's resolver.
requires-python = "==3.14.7"
dependencies = []

[tool.uv]
# The workspace root is a virtual project: it is not built or installed.
package = false

[tool.uv.workspace]
# Only the contracts distribution exists at this wave. `apps/api` is added to
# this list by plan 08 once it creates that distribution; uv errors on a
# declared member path that does not exist yet.
members = ["packages/contracts"]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
]
