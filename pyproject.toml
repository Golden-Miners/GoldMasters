[project]
name = "goldmasters-workspace"
version = "0.1.0"
description = "GoldMasters uv workspace root (virtual project; D-42)."
# D-42: pin the interpreter exactly to the machine's 3.14.7 and state the pin
# here rather than relying on uv's resolver.
requires-python = "==3.14.7"
dependencies = []

[tool.uv]
# The workspace root is a virtual project: it is not built or installed.
package = false

[tool.uv.workspace]
# Only the contracts distribution exists at this wave. `apps/api` is added to
# this list by plan 08 once it creates that distribution; uv errors on a
# declared member path that does not exist yet.
members = ["packages/contracts", "apps/api"]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/contracts/tests"]
pythonpath = ["."]
addopts = "-q --no-header"
markers = ["live_mt5: operator-run MT5 live-terminal verification (R-10; skipped by default)"]

[tool.mypy]
strict = true
python_version = "3.14"
exclude = ["vendor/", ".venv/", "apps/web/"]

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.format]
quote-style = "double"
exclude = [".planning/**"]
