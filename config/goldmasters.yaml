# GoldMasters versioned non-secret defaults (D-15).
# Lowest-priority settings source: environment and `.env` override these.
# Declares NO required key (database_url stays environment-only so its
# absence still fails startup) and NO secret value.
bind_host: 127.0.0.1
bind_port: 8000
trace_file_path: logs/traces.jsonl
log_level: INFO
config_version: "1.0"
